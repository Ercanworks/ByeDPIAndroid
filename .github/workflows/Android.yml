name: Android CI

on:
  push:
    branches: [ master, 'feature/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Reuse downloaded dependencies between runs; downloading everything
          # every time runs into Maven Central's rate limit (HTTP 429)
          cache: 'gradle'

      - name: Build debug APK and run lint
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: byedpi-debug
          path: app/build/outputs/apk/debug/app-debug.apk
